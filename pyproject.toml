[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-aigf-master"
version = "2.0.0b3"
description = "群聊特化LLM聊天机器人（增强版），具有记忆、表情包、跨插件调用、跨bot通信与跨适配器支持"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.2.0",
    "nonebot-plugin-localstore>=0.5.0",
    "nonebot-plugin-alconna>=0.62",
    "nonebot-plugin-uninfo>=0.11",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "anyio>=4.0.0",
    "pillow>=9.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.3.0"]

[tool.nonebot]
plugins = ["nonebot_plugin_aigf_master"]
